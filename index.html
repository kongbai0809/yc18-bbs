<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>银川十八中贴吧 · 校园社区</title>
<style>
/* ===== 变量 ===== */
:root{
  --primary:#0d6b3d;
  --primary-light:#2d8b5e;
  --primary-lighter:#5aad82;
  --bg-primary:#e8f5ee;
  --bg-lighter:#f0faf4;
  --bg-white:#ffffff;
  --text:#2c3e34;
  --text-light:#6b7c72;
  --text-lighter:#9aa8a0;
  --border:#e2e8e4;
  --border-light:#eef2ef;
  --shadow:0 2px 12px rgba(13,107,61,.08);
  --shadow-lg:0 8px 32px rgba(13,107,61,.12);
  --radius:12px;
  --radius-sm:8px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;}
body{
  font-family:var(--font);color:var(--text);background:var(--bg-lighter);
  font-size:14px;line-height:1.6;
}
a{color:var(--primary);text-decoration:none;transition:.2s;}
a:hover{color:var(--primary-light);}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;}
input,textarea,select{font-family:var(--font);outline:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-lighter);}
::-webkit-scrollbar-thumb{background:var(--primary-lighter);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--primary);}

/* ===== 顶部导航 ===== */
header{
  position:sticky;top:0;z-index:100;
  background:var(--bg-white);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
}
.nav-inner{
  max-width:1200px;margin:0 auto;padding:0 20px;
  display:flex;align-items:center;height:60px;gap:20px;
}
.logo{
  display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;
}
.logo img{width:38px;height:38px;border-radius:50%;border:2px solid var(--primary);}
.logo h1{font-size:17px;color:var(--primary);font-weight:700;letter-spacing:1px;}
.logo h1 small{display:block;font-size:9px;color:var(--text-lighter);font-weight:400;letter-spacing:2px;}
nav{display:flex;gap:4px;flex:1;}
nav a{
  padding:8px 16px;border-radius:var(--radius-sm);font-size:13.5px;color:var(--text-light);
  font-weight:500;transition:.15s;
}
nav a:hover{background:var(--bg-primary);color:var(--primary);}
nav a.active{background:var(--primary);color:#fff;}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.btn{
  padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  transition:.15s;display:inline-flex;align-items:center;gap:5px;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px);}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary);}
.btn-outline:hover{background:var(--bg-primary);}
.btn-ghost{background:var(--bg-primary);color:var(--primary);}
.btn-ghost:hover{background:var(--primary-lighter);color:#fff;}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-danger{background:#e74c3c;color:#fff;}
.btn-danger:hover{background:#c0392b;}

/* 用户菜单 */
.user-menu{position:relative;}
.user-avatar{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--primary);
  cursor:pointer;object-fit:cover;background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.user-dropdown{
  position:absolute;top:46px;right:0;width:200px;background:var(--bg-white);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  padding:8px 0;display:none;z-index:200;
}
.user-dropdown.show{display:block;}
.user-dropdown .ud-head{padding:12px 16px;border-bottom:1px solid var(--border-light);}
.user-dropdown .ud-head b{display:block;font-size:14px;color:var(--text);}
.user-dropdown .ud-head span{font-size:11px;color:var(--text-lighter);}
.user-dropdown a{
  display:block;padding:9px 16px;font-size:13px;color:var(--text-light);transition:.15s;
}
.user-dropdown a:hover{background:var(--bg-primary);color:var(--primary);}
.user-dropdown button{
  display:block;width:100%;text-align:left;padding:9px 16px;font-size:13px;
  color:#e74c3c;background:transparent;transition:.15s;
}
.user-dropdown button:hover{background:#fef0f0;}

/* 头衔标签 */
.role-badge{
  display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;
  letter-spacing:.5px;vertical-align:middle;
}
.role-owner{background:linear-gradient(135deg,#f1c40f,#e67e22);color:#fff;}
.role-admin{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;}
.role-student{background:var(--bg-primary);color:var(--primary);}
.role-graduate{background:#f0e6d6;color:#8b7355;}

/* ===== 主内容 ===== */
main{max-width:1200px;margin:0 auto;padding:20px;}
.layout{display:grid;grid-template-columns:220px 1fr 260px;gap:20px;}

/* 左侧分区 */
.sidebar-left{
  background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 12px;box-shadow:var(--shadow);height:fit-content;position:sticky;top:80px;
}
.sidebar-left h4{
  font-size:12px;color:var(--text-lighter);letter-spacing:2px;padding:0 8px 10px;
  text-transform:uppercase;border-bottom:1px solid var(--border-light);margin-bottom:8px;
}
.zone-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--text-light);cursor:pointer;transition:.15s;margin-bottom:2px;
}
.zone-item:hover{background:var(--bg-primary);color:var(--primary);}
.zone-item.active{background:var(--primary);color:#fff;}
.zone-item .zi-icon{font-size:16px;width:20px;text-align:center;}
.zone-item .zi-count{margin-left:auto;font-size:11px;background:rgba(0,0,0,.06);padding:1px 7px;border-radius:10px;}
.zone-item.active .zi-count{background:rgba(255,255,255,.2);}

/* 中间内容区 */
.content-area{min-width:0;}

/* 发帖按钮区 */
.post-bar{
  background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;
}
.post-bar .pb-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  border:2px solid var(--primary);object-fit:cover;
}
.post-bar input{
  flex:1;padding:10px 16px;border:1px solid var(--border);border-radius:20px;
  font-size:13.5px;background:var(--bg-lighter);transition:.2s;
}
.post-bar input:focus{border-color:var(--primary);background:var(--bg-white);}

/* 帖子卡片 */
.post-card{
  background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);transition:.2s;cursor:pointer;
}
.post-card:hover{border-color:var(--primary-lighter);box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.post-card .pc-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-card .pc-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  border:2px solid var(--border);object-fit:cover;
}
.post-card .pc-meta{flex:1;min-width:0;}
.post-card .pc-meta .name{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.post-card .pc-meta .time{font-size:11px;color:var(--text-lighter);}
.post-card .pc-zone{
  font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg-primary);
  color:var(--primary);font-weight:600;flex-shrink:0;
}
.post-card h3{font-size:16px;color:var(--text);margin-bottom:8px;line-height:1.4;}
.post-card .pc-content{
  font-size:13.5px;color:var(--text-light);line-height:1.7;margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.post-card .pc-actions{display:flex;gap:20px;padding-top:10px;border-top:1px solid var(--border-light);}
.post-card .pc-actions button{
  background:transparent;color:var(--text-lighter);font-size:12.5px;
  display:flex;align-items:center;gap:5px;transition:.15s;padding:4px 8px;border-radius:4px;
}
.post-card .pc-actions button:hover{color:var(--primary);background:var(--bg-primary);}
.post-card .pc-actions button.liked{color:#e74c3c;}

/* 右侧边栏 */
.sidebar-right{display:flex;flex-direction:column;gap:16px;}
.widget{
  background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.widget h4{
  font-size:13px;color:var(--primary);font-weight:700;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;gap:6px;
}
.hot-list{display:flex;flex-direction:column;gap:10px;}
.hot-item{
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px;border-radius:var(--radius-sm);transition:.15s;
}
.hot-item:hover{background:var(--bg-primary);}
.hot-item .rank{
  width:20px;height:20px;border-radius:4px;background:var(--border-light);color:var(--text-lighter);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
}
.hot-item:nth-child(1) .rank{background:#e74c3c;color:#fff;}
.hot-item:nth-child(2) .rank{background:#e67e22;color:#fff;}
.hot-item:nth-child(3) .rank{background:#f1c40f;color:#fff;}
.hot-item .hi-title{font-size:12.5px;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* 统计 widget */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-item{text-align:center;padding:10px;background:var(--bg-lighter);border-radius:var(--radius-sm);}
.stat-item .num{font-size:20px;font-weight:700;color:var(--primary);}
.stat-item .label{font-size:11px;color:var(--text-lighter);margin-top:2px;}

/* ===== 注册/登录页 ===== */
.auth-page{
  position:fixed;inset:0;z-index:500;background:var(--bg-lighter);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-box{
  display:grid;grid-template-columns:1fr 1fr;max-width:900px;width:100%;
  background:var(--bg-white);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg);
  max-height:92vh;
}
.auth-left{
  position:relative;min-height:500px;
  background:linear-gradient(135deg,rgba(13,107,61,.85),rgba(45,139,94,.75));
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.auth-left img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;}
.auth-left .al-content{position:relative;z-index:2;text-align:center;color:#fff;padding:30px;}
.auth-left .al-content .school-logo{
  width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.6);
  margin:0 auto 16px;background:#fff;padding:4px;
}
.auth-left .al-content h2{font-size:24px;margin-bottom:8px;letter-spacing:2px;}
.auth-left .al-content p{font-size:13px;opacity:.85;line-height:1.8;}
.auth-right{padding:30px 36px;overflow-y:auto;}
.auth-right h3{font-size:20px;color:var(--primary);margin-bottom:4px;}
.auth-right .sub{font-size:12px;color:var(--text-lighter);margin-bottom:20px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;color:var(--text-light);margin-bottom:5px;font-weight:500;}
.form-group label .req{color:#e74c3c;}
.form-group label .opt{color:var(--text-lighter);font-weight:400;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13px;background:var(--bg-lighter);transition:.2s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--primary);background:var(--bg-white);box-shadow:0 0 0 3px rgba(13,107,61,.1);
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.auth-switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-lighter);}
.auth-switch a{color:var(--primary);font-weight:600;cursor:pointer;}
.auth-tip{
  background:var(--bg-primary);border:1px solid var(--primary-lighter);border-radius:var(--radius-sm);
  padding:10px 14px;font-size:11.5px;color:var(--primary);margin-bottom:16px;line-height:1.6;
}

/* ===== 帖子详情 ===== */
.post-detail{
  background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 28px;box-shadow:var(--shadow);
}
.post-detail .back-btn{
  display:inline-flex;align-items:center;gap:5px;color:var(--text-lighter);font-size:13px;
  cursor:pointer;margin-bottom:16px;transition:.15s;
}
.post-detail .back-btn:hover{color:var(--primary);}
.post-detail h2{font-size:22px;color:var(--text);margin-bottom:14px;line-height:1.4;}
.post-detail .pd-meta{
  display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--border-light);
  margin-bottom:20px;flex-wrap:wrap;
}
.post-detail .pd-meta .avatar{
  width:42px;height:42px;border-radius:50%;background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid var(--primary);
  object-fit:cover;
}
.post-detail .pd-meta .info{flex:1;}
.post-detail .pd-meta .info .name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;}
.post-detail .pd-meta .info .time{font-size:11px;color:var(--text-lighter);}
.post-detail .pd-content{font-size:14.5px;line-height:1.9;color:var(--text);margin-bottom:24px;}
.post-detail .pd-content p{margin-bottom:14px;}
.post-detail .pd-actions{
  display:flex;gap:16px;padding:14px 0;border-top:1px solid var(--border-light);
  border-bottom:1px solid var(--border-light);margin-bottom:20px;
}
.post-detail .pd-actions button{
  background:var(--bg-lighter);color:var(--text-light);padding:8px 20px;border-radius:20px;
  font-size:13px;display:flex;align-items:center;gap:6px;transition:.15s;
}
.post-detail .pd-actions button:hover{background:var(--bg-primary);color:var(--primary);}
.post-detail .pd-actions button.liked{background:#fef0f0;color:#e74c3c;}

/* 评论区 */
.comments h3{font-size:16px;color:var(--text);margin-bottom:16px;}
.comment-form{display:flex;gap:12px;margin-bottom:20px;}
.comment-form .cf-avatar{
  width:38px;height:38px;border-radius:50%;background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  border:2px solid var(--primary);
}
.comment-form .cf-body{flex:1;}
.comment-form textarea{
  width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13px;resize:vertical;min-height:60px;background:var(--bg-lighter);transition:.2s;
}
.comment-form textarea:focus{border-color:var(--primary);background:var(--bg-white);}
.comment-form .cf-submit{text-align:right;margin-top:8px;}
.comment-item{
  display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-light);
}
.comment-item .ci-avatar{
  width:36px;height:36px;border-radius:50%;background:var(--bg-primary);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  border:2px solid var(--border);object-fit:cover;
}
.comment-item .ci-body{flex:1;min-width:0;}
.comment-item .ci-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.comment-item .ci-head .name{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px;}
.comment-item .ci-head .time{font-size:11px;color:var(--text-lighter);}
.comment-item .ci-content{font-size:13.5px;color:var(--text-light);line-height:1.7;margin-bottom:6px;}
.comment-item .ci-actions{display:flex;gap:14px;}
.comment-item .ci-actions button{
  background:transparent;color:var(--text-lighter);font-size:12px;transition:.15s;
  display:flex;align-items:center;gap:4px;
}
.comment-item .ci-actions button:hover{color:var(--primary);}
.comment-item .ci-actions button.liked{color:#e74c3c;}

/* ===== 个人主页 ===== */
.profile-page{margin:-20px;}
.profile-cover{
  height:220px;background:linear-gradient(135deg,var(--primary),var(--primary-light));
  position:relative;overflow:hidden;
}
.profile-cover img{width:100%;height:100%;object-fit:cover;}
.profile-cover .cover-edit{
  position:absolute;bottom:14px;right:14px;background:rgba(0,0,0,.5);color:#fff;
  padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);
  display:flex;align-items:center;gap:5px;transition:.2s;
}
.profile-cover .cover-edit:hover{background:rgba(0,0,0,.7);}
.profile-info{
  max-width:900px;margin:0 auto;padding:0 20px;position:relative;
}
.profile-avatar-wrap{
  margin-top:-60px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
}
.profile-avatar{
  width:120px;height:120px;border-radius:50%;border:4px solid var(--bg-white);
  background:var(--bg-primary);box-shadow:var(--shadow-lg);position:relative;
  display:flex;align-items:center;justify-content:center;font-size:48px;object-fit:cover;
  cursor:pointer;overflow:hidden;
}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-avatar .avatar-edit{
  position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:12px;opacity:0;transition:.2s;
  border-radius:50%;
}
.profile-avatar:hover .avatar-edit{opacity:1;}
.profile-name-area{flex:1;padding-bottom:10px;min-width:200px;}
.profile-name-area h2{font-size:24px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.profile-name-area .username{font-size:14px;color:var(--text-lighter);margin-top:2px;}
.profile-badges{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.profile-badge{
  padding:3px 12px;border-radius:14px;font-size:11px;font-weight:600;
  background:var(--bg-primary);color:var(--primary);border:1px solid var(--primary-lighter);
  display:flex;align-items:center;gap:4px;
}
.profile-signature{
  font-size:14px;color:var(--text-light);font-style:italic;margin-top:10px;
  padding:0 4px;
}
.profile-location{font-size:12.5px;color:var(--text-lighter);margin-top:6px;display:flex;align-items:center;gap:4px;}
.profile-actions{display:flex;gap:10px;padding-bottom:10px;}
.profile-stats{
  display:flex;gap:30px;padding:16px 0;margin-top:16px;border-top:1px solid var(--border-light);
  border-bottom:1px solid var(--border-light);
}
.profile-stats .ps-item{text-align:center;cursor:pointer;}
.profile-stats .ps-item .num{font-size:20px;font-weight:700;color:var(--primary);}
.profile-stats .ps-item .label{font-size:11.5px;color:var(--text-lighter);}
.profile-tabs{display:flex;gap:4px;margin-top:16px;border-bottom:2px solid var(--border-light);}
.profile-tabs a{
  padding:10px 20px;font-size:13.5px;color:var(--text-light);font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;cursor:pointer;
}
.profile-tabs a.active{color:var(--primary);border-bottom-color:var(--primary);}
.profile-content{padding:20px 0;}

/* 编辑资料弹窗 */
.edit-profile-form .form-group{margin-bottom:12px;}

/* ===== 发帖弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:var(--bg-white);border-radius:var(--radius);width:100%;max-width:560px;
  max-height:85vh;overflow-y:auto;padding:24px 28px;box-shadow:var(--shadow-lg);
  position:relative;
}
.modal-box h3{font-size:18px;color:var(--primary);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border-light);}
.modal-box .close-x{
  position:absolute;top:16px;right:20px;font-size:22px;color:var(--text-lighter);
  cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:.15s;
}

/* ===== 简单加密（Base64+偏移，用于敏感信息本地存储） ===== */
function encrypt(str){
  if(!str)return '';
  try{
    const shifted=str.split('').map(c=>String.fromCharCode(c.charCodeAt(0)+3)).join('');
    return btoa(unescape(encodeURIComponent(shifted)));
  }catch(e){return btoa(str);}
}
function decrypt(str){
  if(!str)return '';
  try{
    const shifted=decodeURIComponent(escape(atob(str)));
    return shifted.split('').map(c=>String.fromCharCode(c.charCodeAt(0)-3)).join('');
  }catch(e){return atob(str);}
}

/* ===== 注册逻辑 ===== */
function doRegister(){
  const nickname=$('regNickname').value.trim();
  const username=$('regUsername').value.trim();
  const password=$('regPassword').value;
  const status=$('regStatus').value;
  const gender=$('regGender').value;
  const className=$('regClass').value.trim();
  const year=$('regYear').value;
  const realName=$('regRealName').value.trim();
  const studentNum=$('regStudentNum').value;

  if(!nickname||!username||!password||!className||!year||!realName||!studentNum){
    toast('请填写所有必填项','err');return;
  }
  if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){toast('用户名需3-20位英文/数字/下划线','err');return;}
  if(password.length<6){toast('密码至少6位','err');return;}
  if(!/^\d{4}$/.test(year)){toast('入学年份格式不正确','err');return;}
  if(!/^\d{1,4}$/.test(studentNum)){toast('学号编号格式不正确','err');return;}

  const users=DB.get('users',[]);
  if(users.find(u=>u.username===username)){toast('该用户名已被注册','err');return;}

  const studentId=year+String(studentNum).padStart(4,'0');
  const newUser={
    id:uid(),username,nickname,password,
    role:status==='毕业'?'graduate':'student',
    status,className,
    realName:encrypt(realName),
    studentId:encrypt(studentId),
    gender,
    phone:$('regPhone').value.trim(),
    qq:$('regQQ').value.trim(),
    wechat:$('regWechat').value.trim(),
    email:$('regEmail').value.trim(),
    douyin:$('regDouyin').value.trim(),
    kuaishou:$('regKuaishou').value.trim(),
    signature:'',location:'宁夏银川',
    avatar:'',cover:'',
    regDate:Date.now()
  };
  users.push(newUser);
  DB.set('users',users);
  toast('注册成功！请登录','ok');
  setTimeout(renderLoginForm,800);
}

function submitPost(){
  if(!currentUser){toast('请先登录','err');return;}
  const zone=$('postZone').value;
  const title=$('postTitle').value.trim();
  const content=$('postContent').value.trim();
  const zoneInfo=ZONES.find(z=>z.id===zone);
  if(zoneInfo&&zoneInfo.graduateReadonly&&currentUser.role==='graduate'){toast('毕业生不能在校园墙发帖','err');return;}
  if(!title||!content){toast('请填写标题和内容','err');return;}

    id:uid(),zone,title,content,
    authorId:currentUser.id,authorName:currentUser.nickname,

    date:Date.now(),views:0,likes:0,comments:0

function deletePost(postId){

  let posts=DB.get('posts',[]);
  posts=posts.filter(p=>p.id!==postId);
  DB.set('posts',posts);
  let comments=DB.get('comments',[]);
  comments=comments.filter(c=>c.postId!==postId);
  DB.set('comments',comments);
  toast('帖子已删除');
  renderStats();

/* ===== 评论 ===== */
function submitComment(postId){
  if(!currentUser){toast('请先登录','err');return;}
  const content=$('commentInput').value.trim();
  if(!content){toast('评论内容不能为空','err');return;}
  const comments=DB.get('comments',[]);
  comments.push({
    id:uid(),postId,
    authorId:currentUser.id,authorName:currentUser.nickname,
    authorRole:currentUser.role,authorAvatar:currentUser.avatar||'',
    content,date:Date.now(),likes:0
  });
  DB.set('comments',comments);
  const posts=DB.get('posts',[]);
  const p=posts.find(x=>x.id===postId);
  if(p){p.comments=(p.comments||0)+1;DB.set('posts',posts);}
  toast('评论成功','ok');
  renderHotPosts();
  renderPostDetail();
}
function deleteComment(commentId){
  if(!confirm('确定删除这条评论吗？'))return;
  let comments=DB.get('comments',[]);
  const c=comments.find(x=>x.id===commentId);
  comments=comments.filter(x=>x.id!==commentId);
  DB.set('comments',comments);
  if(c){
    const posts=DB.get('posts',[]);
    const p=posts.find(x=>x.id===c.postId);
    if(p){p.comments=Math.max(0,(p.comments||0)-1);DB.set('posts',posts);}
  }
  toast('评论已删除');
  renderPostDetail();
}

/* ===== 点赞 ===== */
function isPostLiked(postId){
  if(!currentUser)return false;
  const liked=DB.get('postLikes',{});
  return (liked[currentUser.id]||[]).includes(postId);
}
function togglePostLike(postId){
  if(!currentUser){toast('请先登录','err');return;}
  const liked=DB.get('postLikes',{});
  const userLikes=liked[currentUser.id]||[];
  const posts=DB.get('posts',[]);
  const p=posts.find(x=>x.id===postId);
  const idx=userLikes.indexOf(postId);
  if(idx>=0){
    userLikes.splice(idx,1);
    if(p)p.likes=Math.max(0,(p.likes||0)-1);
    toast('已取消点赞');
  }else{
    userLikes.push(postId);
    if(p)p.likes=(p.likes||0)+1;
    toast('点赞成功','ok');
  }
  liked[currentUser.id]=userLikes;
  DB.set('postLikes',liked);
  DB.set('posts',posts);
  renderHotPosts();
  if(currentPostId)renderPostDetail();
  else renderPostList();
}
function isCommentLiked(commentId){
  if(!currentUser)return false;
  const liked=DB.get('commentLikes',{});
  return (liked[currentUser.id]||[]).includes(commentId);
}
function toggleCommentLike(commentId){
  if(!currentUser){toast('请先登录','err');return;}
  const liked=DB.get('commentLikes',{});
  const userLikes=liked[currentUser.id]||[];
  const comments=DB.get('comments',[]);
  const c=comments.find(x=>x.id===commentId);
  const idx=userLikes.indexOf(commentId);
  if(idx>=0){userLikes.splice(idx,1);if(c)c.likes=Math.max(0,(c.likes||0)-1);}
  else{userLikes.push(commentId);if(c)c.likes=(c.likes||0)+1;}
  liked[currentUser.id]=userLikes;
  DB.set('commentLikes',liked);
  DB.set('comments',comments);
  renderPostDetail();
}
function sharePost(postId){
  const url=window.location.href.split('#')[0]+'#post-'+postId;

  }else{prompt('复制链接分享：',url);}

/* ===== 图片上传 ===== */
function uploadAvatar(inputId,callback){
  const input=$(inputId);
  input.onchange=function(e){
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>2*1024*1024){toast('图片不能超过2MB','err');return;}
    const reader=new FileReader();
    reader.onload=function(ev){
      /* 压缩图片 */
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        const maxSize=400;
        let w=img.width,h=img.height;
        if(w>h){if(w>maxSize){h=h*maxSize/w;w=maxSize;}}
        else{if(h>maxSize){w=w*maxSize/h;h=maxSize;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.85);
        callback(dataUrl);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    input.value='';
  };
  input.click();
}
function uploadCover(inputId,callback){
  const input=$(inputId);
  input.onchange=function(e){
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>3*1024*1024){toast('图片不能超过3MB','err');return;}
    const reader=new FileReader();
    reader.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        const maxW=1200;
        let w=img.width,h=img.height;
        if(w>maxW){h=h*maxW/w;w=maxW;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.85);
        callback(dataUrl);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
    input.value='';
  };
  input.click();
}

            '<h2>'+esc(u.nickname)+' '+getRoleBadge(u.role)+'</h2>'+
            '<div class="username">@'+esc(u.username)+' · '+esc(u.status||'')+' · '+esc(u.className||'')+'</div>'+
            '<div class="profile-badges">'+
              '<span class="profile-badge">📅 注册于 '+new Date(u.regDate).toLocaleDateString('zh-CN')+'</span>'+
              '<span class="profile-badge">🎓 '+esc(u.status||'在读')+'</span>'+
            '</div>'+
            (u.signature?'<div class="profile-signature">「'+esc(u.signature)+'」</div>':'')+
            (u.location?'<div class="profile-location">📍 '+esc(u.location)+'</div>':'')+
          '</div>'+
          '<div class="profile-actions">'+
            (isOwner?'<button class="btn btn-primary btn-sm" onclick="openEditProfile()">⚙ 编辑资料</button>':
              '<button class="btn btn-outline btn-sm" onclick="viewProfile(\''+u.id+'\')">💬 私信</button>')+
          '</div>'+
        '</div>'+
        '<div class="profile-stats">'+
          '<div class="ps-item" onclick="viewMyPosts()"><div class="num">'+posts.length+'</div><div class="label">帖子</div></div>'+
          '<div class="ps-item"><div class="num">'+comments.length+'</div><div class="label">评论</div></div>'+
          '<div class="ps-item"><div class="num">'+totalLikes+'</div><div class="label">获赞</div></div>'+
        '</div>'+
        '<div class="profile-tabs">'+
          '<a class="active">📝 TA的帖子</a>'+
        '</div>'+
        '<div class="profile-content">'+
          (posts.length?posts.map(postCardHTML).join(''):
          '<div class="empty-state"><div class="icon">📭</div><p>TA还没有发布过帖子</p></div>')+
        '</div>'+
      '</div>'+
    '</div>';
}
function updateAvatar(dataUrl){
  if(!currentUser)return;
  const users=DB.get('users',[]);
  const u=users.find(x=>x.id===currentUser.id);
  if(u){u.avatar=dataUrl;DB.set('users',users);}
  currentUser.avatar=dataUrl;
  DB.set('currentUser',currentUser);
  renderNavRight();
  renderProfilePage(u);
  toast('头像已更新','ok');
}

/* ===== 编辑资料 ===== */
function openEditProfile(){
  if(!currentUser)return;
  const users=DB.get('users',[]);
  const u=users.find(x=>x.id===currentUser.id);
  if(!u)return;
  $('epNickname').value=u.nickname||'';
  $('epSignature').value=u.signature||'';
  $('epLocation').value=u.location||'';
  $('epPhone').value=u.phone||'';
  $('epQQ').value=u.qq||'';
  $('epWechat').value=u.wechat||'';
  $('epEmail').value=u.email||'';
  $('epDouyin').value=u.douyin||'';
  $('epKuaishou').value=u.kuaishou||'';
  showModal('editProfileModal');
}
function saveProfileEdit(){
  if(!currentUser)return;
  const nickname=$('epNickname').value.trim();
  if(!nickname){toast('昵称不能为空','err');return;}
  const users=DB.get('users',[]);
  const u=users.find(x=>x.id===currentUser.id);
  if(!u)return;
  u.nickname=nickname;
  u.signature=$('epSignature').value.trim();
  u.location=$('epLocation').value.trim();
  u.phone=$('epPhone').value.trim();
  u.qq=$('epQQ').value.trim();
  u.wechat=$('epWechat').value.trim();
  u.email=$('epEmail').value.trim();
  u.douyin=$('epDouyin').value.trim();
  u.kuaishou=$('epKuaishou').value.trim();
  DB.set('users',users);
  currentUser.nickname=u.nickname;
  currentUser.signature=u.signature;
  currentUser.location=u.location;
  DB.set('currentUser',currentUser);
  renderNavRight();
  closeModal('editProfileModal');
  toast('资料已保存','ok');
  if($('profilePage').style.display==='block')renderProfilePage(u);
}

/* ===== 我的帖子 ===== */
function viewMyPosts(){
  if(!currentUser){toast('请先登录','err');return;}
  viewProfile(currentUser.id);
}

/* ===== 后台管理 ===== */
function openAdminPanel(){
  if(!currentUser||(currentUser.role!=='owner'&&currentUser.role!=='admin')){toast('权限不足','err');return;}
  renderAdminContent();
  showModal('adminModal');
}
function renderAdminContent(tab){
  tab=tab||'users';
  const users=DB.get('users',[]);
  const posts=DB.get('posts',[]);
  const comments=DB.get('comments',[]);
  let html='<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">'+
    '<button class="btn btn-sm '+(tab==='users'?'btn-primary':'btn-ghost')+'" onclick="renderAdminContent(\'users\')">👥 用户管理</button>'+
    '<button class="btn btn-sm '+(tab==='posts'?'btn-primary':'btn-ghost')+'" onclick="renderAdminContent(\'posts\')">📝 帖子管理</button>'+
    '<button class="btn btn-sm '+(tab==='comments'?'btn-primary':'btn-ghost')+'" onclick="renderAdminContent(\'comments\')">💬 评论管理</button>'+
    '<button class="btn btn-sm '+(tab==='roles'?'btn-primary':'btn-ghost')+'" onclick="renderAdminContent(\'roles\')">🛡 权限管理</button>'+
    '</div>';
  if(tab==='users'){
    html+='<table class="adminTable" style="width:100%;font-size:12.5px;border-collapse:collapse;">'+
      '<thead><tr style="background:var(--bg-primary);"><th style="padding:8px;text-align:left;">用户</th><th style="padding:8px;text-align:left;">身份</th><th style="padding:8px;text-align:left;">班级</th><th style="padding:8px;text-align:left;">注册时间</th><th style="padding:8px;text-align:left;">操作</th></tr></thead><tbody>';
    users.forEach(u=>{
      html+='<tr style="border-bottom:1px solid var(--border-light);">'+
        '<td style="padding:8px;"><b>'+esc(u.nickname)+'</b><br><span style="color:var(--text-lighter);font-size:11px;">@'+esc(u.username)+'</span></td>'+
        '<td style="padding:8px;">'+getRoleBadge(u.role)+'</td>'+
        '<td style="padding:8px;">'+esc(u.className||'-')+'</td>'+
        '<td style="padding:8px;font-size:11px;color:var(--text-lighter);">'+new Date(u.regDate).toLocaleDateString('zh-CN')+'</td>'+
        '<td style="padding:8px;">'+
          (u.role!=='owner'?'<button class="btn btn-ghost btn-sm" onclick="toggleUserRole(\''+u.id+'\')">切换角色</button> ':
          '<span style="color:var(--text-lighter);font-size:11px;">站长</span>')+
          (u.role!=='owner'?'<button class="btn btn-danger btn-sm" onclick="deleteUser(\''+u.id+'\')" style="margin-left:4px;">删除</button>':'')+
        '</td></tr>';
    });
    html+='</tbody></table>';
  }else if(tab==='posts'){
    html+='<table class="adminTable" style="width:100%;font-size:12.5px;border-collapse:collapse;">'+
      '<thead><tr style="background:var(--bg-primary);"><th style="padding:8px;text-align:left;">标题</th><th style="padding:8px;text-align:left;">作者</th><th style="padding:8px;text-align:left;">分区</th><th style="padding:8px;text-align:left;">时间</th><th style="padding:8px;text-align:left;">操作</th></tr></thead><tbody>';
    posts.sort((a,b)=>b.date-a.date).forEach(p=>{
      const zone=ZONES.find(z=>z.id===p.zone);
      html+='<tr style="border-bottom:1px solid var(--border-light);">'+
        '<td style="padding:8px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(p.title)+'</td>'+
        '<td style="padding:8px;">'+esc(p.authorName)+'</td>'+
        '<td style="padding:8px;">'+(zone?zone.name:'-')+'</td>'+
        '<td style="padding:8px;font-size:11px;color:var(--text-lighter);">'+timeAgo(p.date)+'</td>'+
        '<td style="padding:8px;"><button class="btn btn-danger btn-sm" onclick="adminDeletePost(\''+p.id+'\')">删除</button></td>'+
        '</tr>';
    });
    html+='</tbody></table>';
  }else if(tab==='comments'){
    html+='<table class="adminTable" style="width:100%;font-size:12.5px;border-collapse:collapse;">'+
      '<thead><tr style="background:var(--bg-primary);"><th style="padding:8px;text-align:left;">内容</th><th style="padding:8px;text-align:left;">作者</th><th style="padding:8px;text-align:left;">时间</th><th style="padding:8px;text-align:left;">操作</th></tr></thead><tbody>';
    comments.sort((a,b)=>b.date-a.date).forEach(c=>{
      html+='<tr style="border-bottom:1px solid var(--border-light);">'+
        '<td style="padding:8px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(c.content)+'</td>'+
        '<td style="padding:8px;">'+esc(c.authorName)+'</td>'+
        '<td style="padding:8px;font-size:11px;color:var(--text-lighter);">'+timeAgo(c.date)+'</td>'+
        '<td style="padding:8px;"><button class="btn btn-danger btn-sm" onclick="adminDeleteComment(\''+c.id+'\')">删除</button></td>'+
        '</tr>';
    });
    html+='</tbody></table>';
  }else if(tab==='roles'){
    html+='<div style="background:var(--bg-primary);padding:14px;border-radius:8px;margin-bottom:14px;font-size:12.5px;line-height:1.8;">'+
      '<b>👑 站长</b>：最高权限，可管理所有用户、帖子、评论，不可被删除或降级<br>'+
      '<b>🛡 管理员</b>：可删除帖子和评论，可管理普通用户，可由站长设置<br>'+
      '<b>🎓 在读学生</b>：正常发帖评论权限<br>'+
      '<b>🎓 毕业生</b>：校园墙专区只读，其他分区正常<br>'+
      '</div>'+
      '<p style="font-size:12px;color:var(--text-lighter);">在「用户管理」中点击「切换角色」可在管理员/在读/毕业之间切换</p>';
  }
  $('adminContent').innerHTML=html;
}
function toggleUserRole(userId){
  if(!currentUser||currentUser.role!=='owner'){toast('只有站长可以修改角色','err');return;}
  const users=DB.get('users',[]);
  const u=users.find(x=>x.id===userId);
  if(!u||u.role==='owner')return;
  const roles=['student','admin','graduate'];
  const names={student:'在读学生',admin:'管理员',graduate:'毕业生'};
  const idx=roles.indexOf(u.role);
  u.role=roles[(idx+1)%roles.length];
  u.status=u.role==='graduate'?'毕业':'在读';
  DB.set('users',users);
  toast('已将 '+u.nickname+' 设为 '+names[u.role],'ok');
  renderAdminContent('users');
}
function deleteUser(userId){
  if(!currentUser||currentUser.role!=='owner'){toast('只有站长可以删除用户','err');return;}
  if(!confirm('确定删除该用户吗？其所有帖子和评论也将被删除！'))return;
  let users=DB.get('users',[]);
  users=users.filter(u=>u.id!==userId);
  DB.set('users',users);
  let posts=DB.get('posts',[]);
  posts=posts.filter(p=>p.authorId!==userId);
  DB.set('posts',posts);
  let comments=DB.get('comments',[]);
  comments=comments.filter(c=>c.authorId!==userId);
  DB.set('comments',comments);
  toast('用户已删除');
  renderAdminContent('users');
  renderStats();
}
function adminDeletePost(postId){
  if(!confirm('确定删除这篇帖子吗？'))return;
  let posts=DB.get('posts',[]);
  posts=posts.filter(p=>p.id!==postId);
  DB.set('posts',posts);
  let comments=DB.get('comments',[]);
  comments=comments.filter(c=>c.postId!==postId);
  DB.set('comments',comments);
  toast('帖子已删除');
  renderAdminContent('posts');
  renderStats();
  renderHotPosts();
}
function adminDeleteComment(commentId){
  if(!confirm('确定删除这条评论吗？'))return;
  let comments=DB.get('comments',[]);
  const c=comments.find(x=>x.id===commentId);
  comments=comments.filter(x=>x.id!==commentId);
  DB.set('comments',comments);
  if(c){
    const posts=DB.get('posts',[]);
    const p=posts.find(x=>x.id===c.postId);
    if(p)p.comments=Math.max(0,(p.comments||0)-1);
    DB.set('posts',posts);
  }
  toast('评论已删除');
  renderAdminContent('comments');
  renderStats();
}

  if(currentUser){
    enterApp();
  }else{
    renderLoginForm();
  }
  /* ESC 关闭弹窗 */
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show'));
    }
  });
  console.log('🏫 银川十八中贴吧已加载');
}
init();
